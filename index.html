<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문해은의 p5.js 비주얼 포트폴리오</title>
  <style>
    /* 전체 배경 디자인 및 글꼴 세팅 */
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    header h1 {
      font-size: 2.5rem;
      color: #111;
      margin-bottom: 10px;
    }
    
    header p {
      font-size: 1.1rem;
      color: #666;
    }

    /* 교수님 조건: 2행 2열 구조 레이아웃 */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2열 */
      gap: 30px; /* 액자 사이의 간격 */
      max-width: 1300px;
      width: 100%;
    }

    /* 각 과제를 담는 액자(카드) 스타일 */
    .project-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-5px); /* 마우스 올리면 살짝 들리는 심미적 효과 */
    }

    .project-card h2 {
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 15px;
      color: #0076ff;
    }

    /* ★ 0점 방지 핵심: 사이트 접속 시 바로 보이도록 iframe(액자) 삽입 */
    .canvas-frame {
      width: 100%;
      height: 430px; /* p5.js 캔버스가 여유롭게 들어가는 크기 */
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <header>
    <h1>p5.js 비주얼 포트폴리오</h1>
    <p>문해은 (hiokr98@gmail.com) | 과제 모음집</p>
  </header>

  <!-- 교수님 지정 순서: 2행 2열 (과제1 → 과제4 / 과제2 → 과제3) -->
  <div class="grid-container">
    
    <!-- 1행 1열: 과제 1 (정적) -->
    <div class="project-card">
      <h2>과제 1: 산과 해가 있는 풍경 (정적)</h2>
      <iframe class="canvas-frame" src="sample1/index.html"></iframe>
    </div>

    <!-- 1행 2열: 과제 4 (동적) -->
    <div class="project-card">
      <h2>과제 4: 움직이는 풍경 (동적)</h2>
      <iframe class="canvas-frame" src="sample4/index.html"></iframe>
    </div>

    <!-- 2행 1열: 과제 2 (정적) -->
    <div class="project-card">
      <h2>과제 2: 나의 캐리커쳐 (정적)</h2>
      <iframe class="canvas-frame" src="sample2/index.html"></iframe>
    </div>

    <!-- 2행 2열: 과제 3 (동적) -->
    <div class="project-card">
      <h2>과제 3: 움직이는 캐리커쳐 (동적)</h2>
      <iframe class="canvas-frame" src="sample3/index.html"></iframe>
    </div>

  </div>

</body>
</html>
